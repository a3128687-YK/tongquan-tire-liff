<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #f5f7f8;
      --surface: #ffffff;
      --ink: #15181d;
      --muted: #64748b;
      --line: #d7dde6;
      --brand: #0f766e;
      --brand-dark: #0b5f59;
      --accent: #b45309;
      --warn: #9a3412;
      --soft: #f8fafc;
      --shadow: 0 14px 34px rgba(18, 24, 38, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        repeating-linear-gradient(135deg, rgba(15, 118, 110, .045) 0 8px, transparent 8px 22px),
        linear-gradient(180deg, #eef3f2 0, var(--bg) 260px);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 42px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 14px;
      padding: 10px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tire-mark {
      width: 42px;
      height: 42px;
      border: 8px solid var(--ink);
      border-radius: 50%;
      background:
        radial-gradient(circle, #fff 0 28%, transparent 29%),
        conic-gradient(from 0deg, var(--brand) 0 12%, transparent 12% 24%, var(--accent) 24% 36%, transparent 36% 48%, var(--brand) 48% 60%, transparent 60% 72%, var(--accent) 72% 84%, transparent 84%);
      box-shadow: inset 0 0 0 3px #fff, 0 8px 18px rgba(18, 24, 38, .14);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .user-state {
      color: var(--brand-dark);
      font-size: 14px;
      font-weight: 800;
      text-align: right;
      padding: 7px 10px;
      border: 1px solid rgba(15, 118, 110, .18);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      margin: 16px 0;
    }

    input {
      min-height: 56px;
      width: 100%;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 21px;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    input::placeholder {
      color: #94a3b8;
      font-size: 18px;
      font-weight: 700;
    }

    .search-input {
      grid-column: 1 / -1;
    }

    .mode {
      min-height: 46px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }

    .panel {
      margin-top: 14px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .result-panel {
      border-top: 4px solid var(--brand);
      margin-top: 10px;
      background:
        linear-gradient(90deg, rgba(15, 118, 110, .06), transparent 42%),
        var(--surface);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }

    button.active,
    button:hover {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .clear-button {
      min-width: 86px;
      color: var(--brand-dark);
      border-color: rgba(15, 118, 110, .32);
      box-shadow: var(--shadow);
    }

    .clear-button:hover {
      background: #e8f7f0;
      color: var(--brand-dark);
    }

    .search-button {
      min-width: 86px;
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      box-shadow: var(--shadow);
    }

    .search-button:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 12px;
    }

    .card {
      display: grid;
      gap: 8px;
      min-height: 170px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0, var(--soft) 100%);
      box-shadow: 0 8px 20px rgba(18, 24, 38, .05);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--brand);
    }

    .title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 18px;
      font-weight: 850;
      line-height: 1.25;
    }

    .pattern {
      color: var(--muted);
      font-weight: 700;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .price {
      font-size: 25px;
      font-weight: 900;
      line-height: 1.1;
      color: var(--brand-dark);
    }

    .stock {
      width: fit-content;
      padding: 10px 15px;
      border-radius: 999px;
      background: linear-gradient(180deg, #e6fbef 0, #d7f6e7 100%);
      color: var(--brand-dark);
      font-size: 19px;
      font-weight: 950;
      letter-spacing: 0;
      box-shadow: 0 7px 16px rgba(15, 118, 110, .13);
    }

    .stock.call {
      background: linear-gradient(180deg, #fff3e8 0, #ffe6d2 100%);
      color: var(--warn);
      box-shadow: 0 7px 16px rgba(154, 52, 18, .11);
    }

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(6, 199, 85, .35);
      border-radius: 999px;
      background: #ecfff3;
      color: #057a37;
      font-size: 14px;
      font-weight: 850;
      text-decoration: none;
    }

    .contact-link.phone {
      border-color: rgba(15, 118, 110, .32);
      background: #eefaf8;
      color: var(--brand-dark);
    }

    .contact-icon {
      width: 24px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 6px;
      color: #fff;
      line-height: 1;
    }

    .line-icon {
      width: 34px;
      height: 22px;
      background: #06c755;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 950;
    }

    .phone-icon {
      background: var(--brand);
      font-size: 13px;
    }

    .empty {
      color: var(--muted);
      line-height: 1.55;
      padding: 6px 0 2px;
    }

    .hidden { display: none; }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        repeating-linear-gradient(135deg, rgba(15, 118, 110, .055) 0 8px, transparent 8px 22px),
        rgba(245, 247, 248, .9);
      backdrop-filter: blur(5px);
      transition: opacity .22s ease, visibility .22s ease;
    }

    .loading-overlay.hidden {
      display: grid;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(280px, 86vw);
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 24px 22px 20px;
      border: 1px solid rgba(15, 118, 110, .16);
      border-radius: 8px;
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
    }

    .truck-scene {
      position: relative;
      width: 210px;
      height: 104px;
      overflow: hidden;
    }

    .truck-road {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 10px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(15, 118, 110, .35), transparent);
      overflow: hidden;
    }

    .truck-road::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 34%;
      border-radius: inherit;
      background: var(--brand);
      animation: roadSlide 1.35s linear infinite;
    }

    .truck {
      position: absolute;
      left: 39px;
      top: 38px;
      width: 132px;
      height: 39px;
      animation: truckBounce 1.05s ease-in-out infinite;
    }

    .truck-bed {
      position: absolute;
      left: 6px;
      top: 14px;
      width: 82px;
      height: 27px;
      border-radius: 8px 4px 5px 5px;
      background: var(--brand);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .14);
    }

    .truck-label {
      position: absolute;
      left: 16px;
      top: 18px;
      width: 62px;
      color: #fff;
      font-size: 10px;
      font-weight: 950;
      line-height: 1;
      text-align: center;
      letter-spacing: 0;
      text-shadow: 0 1px 1px rgba(0, 0, 0, .22);
      z-index: 2;
    }

    .truck-cabin {
      position: absolute;
      left: 82px;
      top: 6px;
      width: 42px;
      height: 35px;
      border-radius: 8px 12px 5px 4px;
      background: var(--accent);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .16);
    }

    .truck-window {
      position: absolute;
      left: 92px;
      top: 12px;
      width: 20px;
      height: 13px;
      border-radius: 4px 7px 3px 3px;
      background: #e0f2fe;
      border: 2px solid rgba(255, 255, 255, .75);
    }

    .tire-stack {
      position: absolute;
      left: 8px;
      top: -35px;
      width: 92px;
      height: 52px;
    }

    .cargo-tire {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 5px solid var(--ink);
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 2px #cbd5e1;
    }

    .cargo-tire:nth-child(1) { left: 37px; top: 0; }
    .cargo-tire:nth-child(2) { left: 27px; top: 16px; }
    .cargo-tire:nth-child(3) { left: 47px; top: 16px; }
    .cargo-tire:nth-child(4) { left: 17px; top: 32px; }
    .cargo-tire:nth-child(5) { left: 37px; top: 32px; }
    .cargo-tire:nth-child(6) { left: 57px; top: 32px; }
    .cargo-tire:nth-child(7) { left: 7px; top: 48px; }
    .cargo-tire:nth-child(8) { left: 27px; top: 48px; }
    .cargo-tire:nth-child(9) { left: 47px; top: 48px; }
    .cargo-tire:nth-child(10) { left: 67px; top: 48px; }

    .truck-wheel {
      position: absolute;
      top: 31px;
      width: 21px;
      height: 21px;
      border: 6px solid var(--ink);
      border-radius: 50%;
      background: #fff;
      animation: wheelSpin .9s linear infinite;
    }

    .truck-wheel.front { left: 92px; }
    .truck-wheel.back { left: 21px; }

    .exhaust {
      position: absolute;
      left: 24px;
      top: 44px;
      width: 0;
      height: 0;
    }

    .smoke {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(100, 116, 139, .32);
      animation: smokePuff 1.8s ease-out infinite;
    }

    .smoke:nth-child(1) { animation-delay: 0s; }
    .smoke:nth-child(2) { animation-delay: .45s; }
    .smoke:nth-child(3) { animation-delay: .9s; }
    }

    .loading-text {
      color: var(--brand-dark);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .loading-subtext {
      margin-top: -7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    @keyframes truckBounce {
      0%, 100% { transform: translateY(0) rotate(-.7deg); }
      50% { transform: translateY(-3px) rotate(.7deg); }
    }

    @keyframes wheelSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes smokePuff {
      0% { opacity: 0; transform: translate(0, 0) scale(.35); }
      18% { opacity: .75; }
      100% { opacity: 0; transform: translate(-55px, -20px) scale(1.85); }
    }

    @keyframes roadSlide {
      from { transform: translateX(-120%); }
      to { transform: translateX(330%); }
    }

    @media (max-width: 680px) {
      .app { width: min(100% - 20px, 980px); padding-top: 12px; }
      header, .panel-head { align-items: start; flex-direction: column; }
      .user-state, .hint { text-align: left; }
      .search-row { grid-template-columns: 1fr auto auto; }
      .search-input, .mode { grid-column: 1 / -1; }
      .mode { white-space: normal; }
      button { flex: 1 1 auto; }
      .contact-actions { display: grid; grid-template-columns: 1.25fr .85fr; }
      .contact-link { width: 100%; }
      .results { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay" aria-live="polite">
    <div class="loading-card">
      <div class="truck-scene" aria-hidden="true">
        <div class="exhaust">
          <span class="smoke"></span>
          <span class="smoke"></span>
          <span class="smoke"></span>
        </div>
        <div class="truck">
          <div class="tire-stack">
            <span class="cargo-tire"></span>
            <span class="cargo-tire"></span>
            <span class="cargo-tire"></span>
            <span class="cargo-tire"></span>
          <span class="cargo-tire"></span>
          <span class="cargo-tire"></span>
          <span class="cargo-tire"></span>
          <span class="cargo-tire"></span>
          <span class="cargo-tire"></span>
          <span class="cargo-tire"></span>
          </div>
          <span class="truck-bed"></span>
          <span class="truck-label">統全輪胎</span>
          <span class="truck-cabin"></span>
          <span class="truck-window"></span>
          <span class="truck-wheel back"></span>
          <span class="truck-wheel front"></span>
        </div>
        <div class="truck-road"></div>
      </div>
      <div class="loading-text" id="loadingText">正在登入 LINE</div>
      <div class="loading-subtext">資料準備中，請稍候</div>
    </div>
  </div>

  <main class="app">
    <header>
      <div class="brand-title">
        <span class="tire-mark" aria-hidden="true"></span>
        <h1>統全輪胎價格查詢</h1>
      </div>
      <div class="user-state" id="userState">正在載入...</div>
    </header>

    <div class="search-row">
      <input class="search-input" id="quickSearch" type="search" placeholder="快速搜尋規格，例如 2055516">
      <button class="search-button" id="searchButton" type="button">查詢</button>
      <button class="clear-button" id="clearButton" type="button">清除</button>
      <div class="mode" id="modeText">準備載入</div>
    </div>

    <section class="panel result-panel">
      <div class="panel-head">
        <h2>品牌與價格</h2>
        <span class="hint" id="resultHint">可直接搜尋或選完規格後顯示</span>
      </div>
      <div class="results" id="results"></div>
      <div class="empty" id="emptyState">正在讀取資料...</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>選輪框尺寸</h2>
        <span class="hint" id="rimHint">載入資料中</span>
      </div>
      <div class="chips" id="rimChips"></div>
    </section>

    <section class="panel hidden" id="widthPanel">
      <div class="panel-head">
        <h2>選胎寬</h2>
        <span class="hint">例如 155、175、205</span>
      </div>
      <div class="chips" id="widthChips"></div>
    </section>

    <section class="panel hidden" id="specPanel">
      <div class="panel-head">
        <h2>選完整規格</h2>
        <span class="hint">同胎寬可能有不同扁平比或 C 胎</span>
      </div>
      <div class="chips" id="specChips"></div>
    </section>
  </main>

  <script>
    const LIFF_ID = '2010125232-bNHZhARc';
    const API_URL = 'https://script.google.com/macros/s/AKfycbyN72C-66y587hnc9IwuS7pLSSEBQw70nD93mFex_8UYzt-KCU2jIiOyHty1Az2Nzvs/exec';
    const CONTACT_LINE_URL = 'https://line.me/ti/p/rfM3-6Bntr';
    const CONTACT_PHONE = '0929783497';
    const MIN_LOADING_MS = 1200;
    const state = {
      profile: {},
      role: 'customer',
      inventory: [],
      selectedRim: '',
      selectedWidth: '',
      selectedSpec: '',
      loadingStartedAt: 0,
      searchLogTimer: 0,
      lastLoggedSpec: ''
    };

    const els = {
      loadingOverlay: document.getElementById('loadingOverlay'),
      loadingText: document.getElementById('loadingText'),
      userState: document.getElementById('userState'),
      modeText: document.getElementById('modeText'),
      quickSearch: document.getElementById('quickSearch'),
      searchButton: document.getElementById('searchButton'),
      clearButton: document.getElementById('clearButton'),
      rimHint: document.getElementById('rimHint'),
      rimChips: document.getElementById('rimChips'),
      widthPanel: document.getElementById('widthPanel'),
      widthChips: document.getElementById('widthChips'),
      specPanel: document.getElementById('specPanel'),
      specChips: document.getElementById('specChips'),
      resultHint: document.getElementById('resultHint'),
      results: document.getElementById('results'),
      emptyState: document.getElementById('emptyState')
    };

    boot();

    els.quickSearch.addEventListener('input', () => {
      const query = normalizeSpec(els.quickSearch.value);
      if (!query) {
        renderResults([]);
        els.resultHint.textContent = state.selectedSpec || '可直接搜尋或選完規格後顯示';
        return;
      }

      state.selectedRim = '';
      state.selectedWidth = '';
      state.selectedSpec = '';
      window.clearTimeout(state.searchLogTimer);
      renderResults([]);
      els.resultHint.textContent = query.length < 6 ? '請輸入至少 6 碼後按查詢' : '輸入完成後按查詢';
    });

    els.searchButton.addEventListener('click', runQuickSearch);
    els.clearButton.addEventListener('click', resetView);
    els.quickSearch.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        runQuickSearch();
      }
    });

    async function boot() {
      setLoading(true, '正在登入 LINE');
      state.profile = { userId: '', displayName: '', source: '' };
      els.userState.textContent = 'LINE 身分確認中';
      els.modeText.textContent = '僅限 LINE 開啟';

      try {
        state.profile = await requireLineProfile();
      } catch (error) {
        blockAccess(error.message || '請從 LINE App 內開啟此查詢頁。');
        return;
      }

      setLoading(true, '正在讀取庫存');
      els.userState.textContent = state.profile.displayName;
      els.modeText.textContent = '已取得 LINE 身分';

      try {
        const response = await callApi('bootstrap', { idToken: state.profile.idToken });
        handleBootstrap(response.data);
      } catch (error) {
        handleError(error);
      }
    }

    function setLoading(active, message) {
      if (message) els.loadingText.textContent = message;
      if (active) {
        state.loadingStartedAt = Date.now();
        els.loadingOverlay.classList.remove('hidden');
        return;
      }

      const elapsed = Date.now() - state.loadingStartedAt;
      const remaining = Math.max(0, MIN_LOADING_MS - elapsed);
      window.setTimeout(() => {
        els.loadingOverlay.classList.add('hidden');
      }, remaining);
    }

    async function requireLineProfile() {
      if (!LIFF_ID || !window.liff) {
        throw new Error('LIFF 尚未正確設定，請聯絡管理員。');
      }

      await withTimeout(liff.init({ liffId: LIFF_ID }), 15000, 'LINE 身分驗證逾時，請關閉後從 LINE 重新開啟。');

      if (!liff.isInClient()) {
        throw new Error('此查詢頁僅限從 LINE App 內開啟。');
      }

      if (!liff.isLoggedIn()) {
        liff.login();
        throw new Error('正在導向 LINE 登入，請稍候重新開啟。');
      }

      const profile = await withTimeout(liff.getProfile(), 8000, '無法取得 LINE 使用者資料，請從 LINE 重新開啟。');
      const idToken = liff.getIDToken();
      const userId = profile && profile.userId ? String(profile.userId).trim() : '';
      const displayName = profile && profile.displayName ? String(profile.displayName).trim() : '';

      if (!idToken || !userId || !displayName) {
        throw new Error('無法取得 LINE userId、暱稱或登入憑證，請從 LINE 重新開啟。');
      }

      return { userId, displayName, idToken, source: 'line_client' };
    }

    function blockAccess(message) {
      setLoading(false);
      els.userState.textContent = '未通過 LINE 驗證';
      els.modeText.textContent = '無法顯示資料';
      els.rimHint.textContent = '需從 LINE 開啟';
      els.rimChips.innerHTML = '';
      els.widthPanel.classList.add('hidden');
      els.specPanel.classList.add('hidden');
      renderResults([]);
      els.emptyState.textContent = message;
    }

    async function initLineProfile() {
      if (!LIFF_ID || !window.liff) {
        state.profile = { userId: '', displayName: '預覽使用者' };
        els.userState.textContent = '預覽模式';
        els.modeText.textContent = '尚未設定 LIFF';
        return;
      }

      try {
        await withTimeout(
          liff.init({ liffId: LIFF_ID }),
          6000,
          'LINE 驗證逾時，先以預覽模式載入。'
        );
      } catch (error) {
        state.profile = { userId: '', displayName: '預覽使用者' };
        els.userState.textContent = '預覽模式';
        els.modeText.textContent = error.message || 'LINE 驗證逾時';
        return;
      }

      if (!liff.isLoggedIn()) {
        els.userState.textContent = 'LINE 未登入';
        els.modeText.textContent = '準備登入 LINE';
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      state.profile = {
        userId: profile.userId,
        displayName: profile.displayName
      };
      els.userState.textContent = profile.displayName;
    }

    function withTimeout(promise, timeoutMs, message) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), timeoutMs);
      });

      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    function handleBootstrap(response) {
      setLoading(false);
      if (!response || !response.ok) {
        els.userState.textContent = '未授權';
        els.modeText.textContent = '請聯絡管理員';
        els.emptyState.textContent = response && response.message ? response.message : '目前無法載入資料。';
        return;
      }

      state.role = response.role || 'customer';
      state.inventory = response.inventory || [];
      const roleText = state.role === 'admin' ? '管理者模式' : '客戶模式';
      const loginText = response.loginRecord && response.loginRecord.recorded ? '已記錄登入' : '訪客';
      els.modeText.textContent = `${roleText} / ${loginText}`;
      renderRims();
      renderResults([]);
      els.emptyState.textContent = '可輸入規格搜尋，或先選擇輪框尺寸。';
      els.rimHint.textContent = `共 ${unique(state.inventory.map(item => item.rim)).length} 種尺寸`;
    }

    function resetView() {
      state.selectedRim = '';
      state.selectedWidth = '';
      state.selectedSpec = '';
      state.lastLoggedSpec = '';
      window.clearTimeout(state.searchLogTimer);
      els.quickSearch.value = '';
      els.widthPanel.classList.add('hidden');
      els.specPanel.classList.add('hidden');
      els.widthChips.innerHTML = '';
      els.specChips.innerHTML = '';
      renderRims();
      renderResults([]);
      els.resultHint.textContent = '可直接搜尋或選完規格後顯示';
      els.emptyState.textContent = '可輸入規格搜尋，或先選擇輪框尺寸。';
      els.rimHint.textContent = `共 ${unique(state.inventory.map(item => item.rim)).length} 種尺寸`;
      els.quickSearch.focus();
    }

    function runQuickSearch() {
      const query = normalizeSpec(els.quickSearch.value);
      state.selectedRim = '';
      state.selectedWidth = '';
      state.selectedSpec = '';
      window.clearTimeout(state.searchLogTimer);

      if (!query) {
        renderResults([]);
        els.resultHint.textContent = '請先輸入規格再按查詢';
        els.emptyState.textContent = '可輸入 2055516 這類規格代碼後查詢。';
        return;
      }

      if (query.length < 6) {
        renderResults([]);
        els.resultHint.textContent = '請輸入至少 6 碼後按查詢';
        els.emptyState.textContent = '輸入完整規格比較能準確找到尺寸。';
        return;
      }

      els.widthPanel.classList.add('hidden');
      els.specPanel.classList.add('hidden');
      els.widthChips.innerHTML = '';
      els.specChips.innerHTML = '';
      renderRims();

      const matches = state.inventory.filter(item => normalizeSpec(item.spec).includes(query));
      renderResults(matches);
      els.resultHint.textContent = `查詢 ${query}，共 ${matches.length} 筆`;
      els.emptyState.textContent = matches.length ? '' : '查無符合規格，請確認輸入是否正確。';
      logQuery(query, matches);
    }

    function renderRims() {
      const rims = unique(state.inventory.map(item => item.rim)).filter(Boolean).sort(numberSort);
      renderChips(els.rimChips, rims, state.selectedRim, rim => {
        state.selectedRim = rim;
        state.selectedWidth = '';
        state.selectedSpec = '';
        els.quickSearch.value = '';
        renderRims();
        renderWidths();
        renderSpecs();
        renderResults([]);
        els.emptyState.textContent = '請選擇胎寬。';
      }, rim => `${rim} 吋`);
    }

    function renderWidths() {
      const widths = unique(state.inventory
        .filter(item => item.rim === state.selectedRim)
        .map(item => item.width))
        .filter(Boolean)
        .sort(numberSort);

      els.widthPanel.classList.toggle('hidden', !state.selectedRim);
      renderChips(els.widthChips, widths, state.selectedWidth, width => {
        state.selectedWidth = width;
        state.selectedSpec = '';
        els.quickSearch.value = '';
        renderWidths();
        renderSpecs();
        renderResults([]);
        els.emptyState.textContent = '請選擇完整規格。';
      });
    }

    function renderSpecs() {
      const specs = unique(state.inventory
        .filter(item => item.rim === state.selectedRim && item.width === state.selectedWidth)
        .map(item => item.spec))
        .sort((a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true }));

      els.specPanel.classList.toggle('hidden', !state.selectedWidth);
      renderChips(els.specChips, specs, state.selectedSpec, spec => {
        state.selectedSpec = spec;
        els.quickSearch.value = '';
        renderSpecs();
        const matches = state.inventory.filter(item => item.spec === spec);
        renderResults(matches);
        els.resultHint.textContent = `${spec}，共 ${matches.length} 筆`;
        logQuery(spec, matches);
      });
    }

    function renderResults(items) {
      els.results.innerHTML = '';
      if (!items.length) {
        els.emptyState.classList.remove('hidden');
        return;
      }

      els.emptyState.classList.add('hidden');
      items.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        const isCallOnly = item.stockLabel === '請來電洽詢' || item.stockLabel === '請來電洽詢(0條)';
        const stockClass = isCallOnly ? 'stock call' : 'stock';
        const stockText = isCallOnly ? '請來電洽詢(0條)' : `庫存 ${item.stockLabel} 條`;
        const adminLine = state.role === 'admin' && item.updatedAt
          ? `<div class="meta">更新：${escapeHtml(item.updatedAt || '')}</div>`
          : '';
        const contactLine = `
          <div class="contact-actions">
            <a class="contact-link" href="${CONTACT_LINE_URL}" target="_blank" rel="noopener">
              <span class="contact-icon line-icon">LINE</span>
              聯繫統全-張欽漢
            </a>
            <a class="contact-link phone" href="tel:${CONTACT_PHONE}">
              <span class="contact-icon phone-icon">☎</span>
              撥打電話
            </a>
          </div>
        `;

        card.innerHTML = `
          <div class="title">
            <span>${escapeHtml(item.brand)}</span>
            <span class="pattern">${escapeHtml(item.pattern || '-')}</span>
          </div>
          <div class="meta">${escapeHtml([item.spec, item.loadSpeed, item.year ? `年份 ${item.year}` : ''].filter(Boolean).join(' ・ '))}</div>
          <div class="price">${escapeHtml(item.price)}</div>
          <div class="${stockClass}">${escapeHtml(stockText)}</div>
          ${contactLine}
          ${adminLine}
        `;
        els.results.append(card);
      });
    }

    function logQuery(spec, matches) {
      if (!spec || spec === state.lastLoggedSpec) return;
      state.lastLoggedSpec = spec;
      const inStockCount = matches.filter(item => item.stockLabel !== '請來電洽詢' && item.stockLabel !== '請來電洽詢(0條)').length;
      callApi('logQuery', {
        idToken: state.profile.idToken,
        spec,
        rim: state.selectedRim,
        width: state.selectedWidth,
        resultCount: matches.length,
        inStockCount
      }).catch(error => console.warn('logQuery failed', error));
    }

    function callApi(action, payload) {
      return new Promise((resolve, reject) => {
        const callbackName = `__tongquan_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const script = document.createElement('script');
        const params = new URLSearchParams({
          api: action,
          payload: JSON.stringify(payload || {}),
          callback: callbackName
        });

        const cleanup = () => {
          delete window[callbackName];
          script.remove();
        };

        window[callbackName] = response => {
          cleanup();
          if (response && response.ok) {
            resolve(response);
          } else {
            reject(new Error(response && response.message ? response.message : '後台回應失敗'));
          }
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('無法連線後台，請稍後再試。'));
        };

        script.src = `${API_URL}?${params.toString()}`;
        document.body.append(script);
      });
    }

    function renderChips(container, values, activeValue, onClick, label = value => value) {
      container.innerHTML = '';
      values.forEach(value => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label(value);
        button.className = value === activeValue ? 'active' : '';
        button.addEventListener('click', () => onClick(value));
        container.append(button);
      });
    }

    function handleError(error) {
      setLoading(false);
      els.userState.textContent = '載入失敗';
      els.modeText.textContent = '系統暫時不可用';
      els.emptyState.textContent = error && error.message ? error.message : '請稍後再試。';
      console.error(error);
    }

    function unique(values) {
      return Array.from(new Set(values));
    }

    function numberSort(a, b) {
      return Number(a) - Number(b);
    }

    function normalizeSpec(value) {
      return String(value || '').replace(/\D/g, '');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }
  </script>
</body>
</html>
